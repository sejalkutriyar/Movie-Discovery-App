services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - TMDB_API_KEY=${TMDB_API_KEY}
      - CACHE_TTL_SECONDS=900
      - DB_PATH=./src/db/wishlist.sqlite
    volumes:
      - backend_data:/app/src/db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data: